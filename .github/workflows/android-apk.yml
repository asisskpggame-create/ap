name: Build & Release Personal Life OS APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore (Preserves Firebase Google Sign-In SHA-1)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass androidrelease -keypass androidrelease \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Personal Life OS,O=AIStudio,C=US"
          fi

      - name: Ensure .env and Firebase Config exist for Standalone APK Build
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || echo "GEMINI_API_KEY=" > .env
          fi
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "957078935606",
              "project_id": "gen-lang-client-0280793534",
              "storage_bucket": "gen-lang-client-0280793534.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:957078935606:android:925e0574c700d106c9a097",
                  "android_client_info": {
                    "package_name": "com.aistudio.personallifeos.kxmpzq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "957078935606-m9055dtit0577lvkjmp2sqvffbld1ueg.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.personallifeos.kxmpzq",
                      "certificate_hash": "24f9fedb0e3af68bfe2bf6b906ce1114aa87b09d"
                    }
                  },
                  {
                    "client_id": "957078935606-nfbplhuqu6k4g2j1r5rm83m4e04u8s8t.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDniF4amC-qH1eL1NqLKOvo6EgZdqhvda8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "957078935606-nfbplhuqu6k4g2j1r5rm83m4e04u8s8t.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-personal-a911cedb-55ed-4d73-8197-39f8e08a22de</string>
          </resources>
          EOF
          fi

      - name: Build Signed Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: androidrelease
          KEY_PASSWORD: androidrelease
        run: |
          gradle assembleDebug assembleRelease --stacktrace
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Personal-Life-OS-v1.2.0-SuperApp-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/Personal-Life-OS-v1.2.0-SuperApp-Release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Life-OS-v1.2.0-APKs
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "Personal Life OS v1.2.${{ github.run_number }} (Super-App + Colloquial Toman Fix + S24 Ultra Verified)"
          body: |
            ## 💎 Personal Life OS v1.2.0 — Super-App Liquid Glass Edition (`versionCode = 3`)

            سیستم‌عامل جامع مدیریت زندگی شخصی، سلامت، مالی و دستیار هوشمند فارسی با طراحی **Multi-Layered Liquid Glass**، پشتیبانی کامل از **محاسبه محاوره‌ای تومان در ویس و ثبت هزینه (`۵۰۰ تومان` ⬅ `۵۰۰,۰۰۰ تومان`)** و معماری **Local-First (آفلاین + همگام‌سازی ابری)**.

            ---

            ### 📥 راهنمای دانلود و نصب فایل‌های APK (نسخه `1.2.0` - `versionCode = 3`)
            - ⭐ **`Personal-Life-OS-v1.2.0-SuperApp-Debug.apk` (پیشنهادی):** امضا شده با کلید اصلی پروژه؛ پشتیبانی کامل از ورود با حساب گوگل (Google Sign-In / Firebase Auth)، همگام‌سازی ابری و تمام امکانات آفلاین.
            - 📦 **`Personal-Life-OS-v1.2.0-SuperApp-Release.apk`:** نسخه ریلیز بهینه‌سازی‌شده (مناسب استفاده در حالت آفلاین/لوکال روی گوشی).
            > **نکته نصب:** به دلیل ارتقای `versionCode` به `3`، این نسخه بدون نیاز به پاک کردن نسخه‌های قبلی مستقیماً روی آن‌ها آپدیت می‌شود.

            ---

            ### 🆕 قابلیت‌های جدید و اصلاحات نسخه `v1.2.0`
            1. **🗣️ اصلاح هوشمند محاسبه محاوره‌ای تومان در ثبت صوتی (Voice) و دستی:**
               - تشخیص هوشمند گفتار محاوره‌ای ایرانی: وقتی در ویس بگویید **«۵۰۰ تومان سیگار خریدم»** یا **«پانصد تومن سیگار خریدم»** یا **«۹۰ تومن قهوه»**، سیستم به‌صورت خودکار عددهای ۱ تا ۹۹۹ تومان را در مقیاس واقعی بازار ایران (**× ۱,۰۰۰** یعنی **`۵۰۰,۰۰۰ تومان`** و **`۹۰,۰۰۰ تومان`**) محاسبه و ثبت می‌کند.
               - پشتیبانی از عبارات ترکیبی میلیونی (مثل «۲ میلیون و ۵۰۰» ⬅ `۲,۵۰۰,۰۰۰ تومان`) و اعداد حروفی فارسی (`پانصد`، `دویست`، `صد و پنجاه` و غیره).
               - تشخیص خودکار عنوان کالا (مثل «خرید سیگار» در دسته‌بندی «قهوه، کافه و سیگار») و نمایش پیش‌نمایش زنده معادل محاوره‌ای هنگام تایپ دستی مبلغ.
            2. **📅 تقویم تعاملی شمسی (جلالی) با نقشه حرارتی (Jalali Calendar Heatmap):**
               - نمایش ۳۰ روز ماه جاری شمسی با رنگ‌بندی حرارتی بر اساس فعالیت‌های روز (تسک، کالری، آب، هزینه) و مشاهده خلاصه کامل هر روز با لمس آن.
            3. **🏦 خواننده هوشمند پیامک بانکی ایران (Smart Bank SMS Parser):**
               - شناسایی خودکار نام بانک (ملت، ملی، بلوبانک، سامان، پاسارگاد، تجارت، صادرات، رسالت و...)، تبدیل خودکار مبالغ **ریال به تومان (÷ ۱۰)**، استخراج مانده حساب و دسته‌بندی هوشمند.
            4. **📸 اسکنر تصویری غذا و رسید خرید (Gemini Vision Photo Scanner):**
               - انتخاب عکس غذا یا رسید خرید با Photo Picker استاندارد اندروید (بدون نیاز به دسترسی حافظه) برای تخمین کالری/ماکروها یا استخراج مبلغ رسید به تومان.
            5. **🔐 قفل امنیتی بیومتریک و پین ۴ رقمی (Biometric & PIN Vault Lock) + موج زنده آب (Animated Water Wave):**
               - محافظت از اطلاعات مالی و شخصی با اثر انگشت / تشخیص چهره یا پین ۴ رقمی و ویژوالایزر موج سینوسی زنده برای مصرف آب روزانه.
            6. **📊 خروجی اکسل/CSV ماهانه + حالت روز و شب شیشه‌ای (Daylight & Obsidian Liquid Glass) + فیلتر بخش‌های داشبورد.**
            7. **🛡️ پایداری ۱۰۰٪ روی Samsung Galaxy S24 Ultra (One UI / Vulkan / 505 PPI).**
          files: |
            release-assets/Personal-Life-OS-v1.2.0-SuperApp-Debug.apk
            release-assets/Personal-Life-OS-v1.2.0-SuperApp-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

