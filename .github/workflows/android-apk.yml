name: Build & Release Personal Life OS APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore (Preserves Firebase Google Sign-In SHA-1)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass androidrelease -keypass androidrelease \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Personal Life OS,O=AIStudio,C=US"
          fi

      - name: Ensure .env and Firebase Config exist for Standalone APK Build
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || echo "GEMINI_API_KEY=" > .env
          fi
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "957078935606",
              "project_id": "gen-lang-client-0280793534",
              "storage_bucket": "gen-lang-client-0280793534.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:957078935606:android:925e0574c700d106c9a097",
                  "android_client_info": {
                    "package_name": "com.aistudio.personallifeos.kxmpzq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "957078935606-m9055dtit0577lvkjmp2sqvffbld1ueg.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.personallifeos.kxmpzq",
                      "certificate_hash": "24f9fedb0e3af68bfe2bf6b906ce1114aa87b09d"
                    }
                  },
                  {
                    "client_id": "957078935606-nfbplhuqu6k4g2j1r5rm83m4e04u8s8t.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDniF4amC-qH1eL1NqLKOvo6EgZdqhvda8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "957078935606-nfbplhuqu6k4g2j1r5rm83m4e04u8s8t.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-personal-a911cedb-55ed-4d73-8197-39f8e08a22de</string>
          </resources>
          EOF
          fi

      - name: Build Signed Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: androidrelease
          KEY_PASSWORD: androidrelease
        run: |
          gradle assembleDebug assembleRelease --stacktrace
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Personal-Life-OS-v1.3.0-FinancePro-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/Personal-Life-OS-v1.3.0-FinancePro-Release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Life-OS-v1.3.0-APKs
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: "Personal Life OS v1.3.${{ github.run_number }} (Finance Pro + Live Bank SMS Inbox + Analytics Hub)"
          body: |
            ## 💎 Personal Life OS v1.3.0 — Finance Pro & Liquid Glass Edition (`versionCode = 4`)

            سیستم‌عامل جامع مدیریت مالی، اهداف، عادت‌ها، سلامت و دستیار هوشمند فارسی با اولویت‌بندی **امور مالی به‌عنوان تب اول**، **اتصال زنده به صندوق پیامک‌های بانکی ایران (`READ_SMS`)**، **مدیریت دسته‌بندی‌ها و دکمه‌های ۱-لمسی خرج** و **مرکز نمودار و روند تحلیلی**.

            ---

            ### 📥 راهنمای دانلود و نصب فایل‌های APK (نسخه `1.3.0` - `versionCode = 4`)
            - ⭐ **`Personal-Life-OS-v1.3.0-FinancePro-Debug.apk` (پیشنهادی):** امضا شده با کلید اصلی پروژه؛ پشتیبانی کامل از ورود با حساب گوگل (Google Sign-In / Firebase Auth)، همگام‌سازی ابری و تمام امکانات آفلاین.
            - 📦 **`Personal-Life-OS-v1.3.0-FinancePro-Release.apk`:** نسخه ریلیز بهینه‌سازی‌شده (مناسب استفاده در حالت آفلاین/لوکال روی گوشی).
            > **نکته نصب:** به دلیل ارتقای `versionCode` به `4`، این نسخه بدون نیاز به پاک کردن نسخه‌های قبلی مستقیماً روی آن‌ها آپدیت می‌شود.

            ---

            ### 🆕 قابلیت‌های جدید و بازطراحی نسخه `v1.3.0`
            1. **💳 بازطراحی کامل تب «امور مالی» و قرارگیری در اولویت اول منوی برنامه:**
               - تفکیک حرفه‌ای به ۲ بخش اختصاصی: **«ورودی و خروجی‌ها»** و **«طلب و بدهی»**.
               - **صندوق پیامک‌های بانکی زنده (Auto-SMS Inbox Reader):** خواندن مستقیم پیامک‌های بانکی گوشی (`READ_SMS`)، تشخیص خودکار ۱۷ بانک ایرانی، استخراج مبلغ (تبدیل خودکار ریال به تومان)، نمایش **مانده حساب**، تشخیص خودکار پذیرنده/دسته‌بندی و ثبت تراکنش با ۱ لمس.
               - **مدیریت دسته‌بندی‌های خرج و مخارج:** امکان افزودن دسته‌بندی‌های سفارشی جدید همراه با آیکون‌های اختصاصی.
               - **دکمه‌های ثبت سریع ۱-لمسی (1-Tap Presets):** تعریف، ویرایش نام/قیمت و حذف دکمه‌های آماده برای مخارج پرتکرار روزانه.
               - **لیست پیشرفته تراکنش‌ها:** مجهز به جستجوی زنده، ویرایش کامل تراکنش، تسویه ۱-لمسی طلب/بدهی، پشتیبانی چندارزی (تومان، دلار، یورو، درهم، ریال)، **خروجی اکسل (`CSV`)** و **کپی گزارش متنی**.
               - **نمودار خطی روند ۳۰ روزه خرج و درآمد (`MonthlySpendingTrendsLineChart`) + نمودار حلقه‌ای سهم دسته‌بندی‌ها (`MonthlyVisualExpensesGlassCard`) + کارت تراز دارایی خالص (`Net Worth`).**
            2. **📊 تبدیل صفحه خانه به مرکز «نمودار و روند» (Analytics & Trends Hub):**
               - حذف فرم‌ها و دکمه‌های پراکنده و تمرکز کامل بر نمایش گرافیکی وضعیت، نمودارها و کارت‌های خلاصه به همراه دکمه‌های ناوبری مستقیم به تب‌های تخصصی.
            3. **🎯 یکپارچه‌سازی تب «اهداف و عادت‌ها» و تب مستقل «سلامت و کالری»:**
               - تفکیک کامل «اهداف بلندمدت/تسک‌ها» و «عادت‌های روتین روزانه» در تب اهداف و انتقال کامل ثبت خواب، ورزش، آب و کالری به تب اختصاصی سلامت.
          files: |
            release-assets/Personal-Life-OS-v1.3.0-FinancePro-Debug.apk
            release-assets/Personal-Life-OS-v1.3.0-FinancePro-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

