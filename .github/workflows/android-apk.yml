name: Build & Release Personal Life OS APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies, Run 30/30 SMS & Notification Tests, and Build Web Bundle
        run: |
          npm install --include=dev --no-audit --no-fund
          npm test
          npm run lint
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 & Build-Tools 36.0.0
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore (Preserves Firebase Google Sign-In SHA-1)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass androidrelease -keypass androidrelease \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Personal Life OS,O=AIStudio,C=US"
          fi

      - name: Build Signed Debug & Release APKs (v1.6.0R - versionCode 7)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: androidrelease
          KEY_PASSWORD: androidrelease
        run: |
          gradle assembleDebug assembleRelease --stacktrace
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Personal-Life-OS-v1.6.0R-FinancePro-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/Personal-Life-OS-v1.6.0R-FinancePro-Release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Life-OS-v1.6.0R-APKs
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK (v1.6.0R)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0R
          name: "Personal Life OS v1.6.0R (Smart Notification Center, Bank Receipt Listener & Visual Bank Selector — versionCode 7)"
          body: |
            ## 💎 Personal Life OS v1.6.0R — Smart Notification Center & Bank Receipt Listener Release (`versionCode = 7`)

            سیستم‌عامل جامع مدیریت مالی، مرکز هوشمند نوتیفیکیشن و لاگ فیش‌های بانکی (الهام‌گرفته از معماری میرزا)، انتخابگر بصری بانک‌ها و دستیار هوشمند فارسی.

            ---

            ### 📥 راهنمای دانلود و نصب فایل‌های APK (نسخه `1.6.0R` - `versionCode = 7`)
            - ⭐ **`Personal-Life-OS-v1.6.0R-FinancePro-Debug.apk` (پیشنهادی):** امضاشده با کلید اصلی پروژه؛ آماده نصب مستقیم روی گوشی اندروید.
            - 📦 **`Personal-Life-OS-v1.6.0R-FinancePro-Release.apk`:** نسخه ریلیز امضاشده با کلید انتشار (`my-upload-key.jks`).
            > **نکته نصب:** به دلیل ارتقای `versionCode` به `7`، این نسخه بدون نیاز به پاک کردن نسخه‌های قبلی و با حفظ تمام داده‌ها مستقیماً آپدیت می‌شود.

            ---

            ### 🆕 قابلیت‌های نسخه `v1.6.0R` (`versionCode = 7`)
            1. **🔔 مرکز هوشمند نوتیفیکیشن و شنونده زنده فیش‌های بانکی (`NotificationCenterModal`):** پایش لحظه‌ای نوتیفیکیشن‌های بلوبانک (عادی و حالت پُل)، ویپاد، بام بانک ملی، همراه بانک ملت و صندوق پیامک (`SMS_INBOX`)، بنر شناور بالای صفحه (`FloatingNotificationBanner`)، ثبت خودکار مشروط (`AUTO_REGISTERED`) یا صف بررسی ۱-کلیکی (`PENDING_USER_ACTION`) و فیلتر خودکار رمز پویا (`OTP`).
            2. **🏦 انتخابگر بصری بانک‌ها با کارت پیش‌نمایش زنده (`BankVisualSelectorSheet`):** شیت بصری انتخاب بانک با لوگوی اختصاصی بانک‌های ایران، پیش‌نمایش زنده کارت بانکی و پیشنهاد سرشماره‌های دریافت‌شده.
            3. **⚙️ تنظیمات پیشرفته شنونده نوتیفیکیشن و هشدارهای مالی (`SettingsScreen`):** مدیریت مجزای منابع نوتیفیکیشن، سقف هشدار تراکنش سنگین، مرز هشدار افت موجودی حساب و ساعات سکوت شبانه (`Quiet Hours`).
            4. **🛡️ موتور ممیزی‌شده پردازش پیامک بانکی ایران (`30/30 PASS`):** اعتبارسنجی در سطح هر قالب (`Template-Level Verification`) و نسخه قالب (`tpl.version`)، مسدودسازی کامل ثبت پیش‌فرض `UNKNOWN` و سیاست صریح تطابق سرشماره فرستنده.
          files: |
            release-assets/Personal-Life-OS-v1.6.0R-FinancePro-Debug.apk
            release-assets/Personal-Life-OS-v1.6.0R-FinancePro-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
