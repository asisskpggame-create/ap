name: Build & Release Personal Life OS APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore Debug Keystore (Preserves Firebase Google Sign-In SHA-1)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Release Keystore
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass androidrelease -keypass androidrelease \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Personal Life OS,O=AIStudio,C=US"
          fi

      - name: Ensure .env and Firebase Config exist for Standalone APK Build
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || echo "GEMINI_API_KEY=" > .env
          fi
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "957078935606",
              "project_id": "gen-lang-client-0280793534",
              "storage_bucket": "gen-lang-client-0280793534.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:957078935606:android:925e0574c700d106c9a097",
                  "android_client_info": {
                    "package_name": "com.aistudio.personallifeos.kxmpzq"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "957078935606-m9055dtit0577lvkjmp2sqvffbld1ueg.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.personallifeos.kxmpzq",
                      "certificate_hash": "24f9fedb0e3af68bfe2bf6b906ce1114aa87b09d"
                    }
                  },
                  {
                    "client_id": "957078935606-nfbplhuqu6k4g2j1r5rm83m4e04u8s8t.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDniF4amC-qH1eL1NqLKOvo6EgZdqhvda8"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "957078935606-nfbplhuqu6k4g2j1r5rm83m4e04u8s8t.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-personal-a911cedb-55ed-4d73-8197-39f8e08a22de</string>
          </resources>
          EOF
          fi

      - name: Build Signed Debug & Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: androidrelease
          KEY_PASSWORD: androidrelease
        run: |
          gradle assembleDebug assembleRelease --stacktrace
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/Personal-Life-OS-v1.4.0-FinancePro-Debug.apk
          cp app/build/outputs/apk/release/app-release.apk release-assets/Personal-Life-OS-v1.4.0-FinancePro-Release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Life-OS-v1.4.0-APKs
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: "Personal Life OS v1.4.${{ github.run_number }} (Unified 4-Pillar Architecture + Debt-to-Goal Link + Unified Reminders)"
          body: |
            ## 💎 Personal Life OS v1.4.0 — Unified 4-Pillar Architecture & Liquid Glass Edition (`versionCode = 5`)

            سیستم‌عامل جامع مدیریت مالی، اهداف و مسیر، داشبورد وضعیت و دستیار هوشمند فارسی (منطبق بر نقشه راه [`APP_ROADMAP_FA.md`](./APP_ROADMAP_FA.md) و تأییدشده در [`ROADMAP_PROGRESS.md`](./ROADMAP_PROGRESS.md)).

            ---

            ### 📥 راهنمای دانلود و نصب فایل‌های APK (نسخه `1.4.0` - `versionCode = 5`)
            - ⭐ **`Personal-Life-OS-v1.4.0-FinancePro-Debug.apk` (پیشنهادی):** امضا شده با کلید اصلی پروژه؛ پشتیبانی کامل از ورود با حساب گوگل (Google Sign-In / Firebase Auth)، همگام‌سازی ابری و تمام امکانات آفلاین.
            - 📦 **`Personal-Life-OS-v1.4.0-FinancePro-Release.apk`:** نسخه ریلیز بهینه‌سازی‌شده (مناسب استفاده در حالت آفلاین/لوکال روی گوشی).
            > **نکته نصب:** به دلیل ارتقای `versionCode` به `5` و مهاجرت غیرمخرب دیتابیس (`MIGRATION_5_6`)، این نسخه بدون نیاز به پاک کردن نسخه‌های قبلی و با حفظ تمام داده‌ها مستقیماً روی آن‌ها آپدیت می‌شود.

            ---

            ### 🆕 قابلیت‌های جدید نسخه `v1.4.0` (فازهای ۰ تا ۶ نقشه راه)
            1. **🧭 ناوبری استاندارد ۴ بخشی:** ۱. مالی (`DAILY_LOG`)، ۲. اهداف و مسیر (`GOALS_AND_HABITS`)، ۳. داشبورد (`HOME`)، ۴. AI (`AI_ASSISTANT`).
            2. **🔗 اتصال مستقیم بدهی به اهداف و مسیر (`Debt-to-Goal Link`):** ساخت برنامه بازپرداخت اقساط (`linkedDebtId`)، پرداخت جزئی قسط (`paidAmount`) با کلید ضدتکرار، عدم شمارش انتقال بین حساب‌های شخصی (`TRANSFER`) در درآمد/هزینه، و بستن خودکار تسک‌های قسط پس از تسویه بدهی.
            3. **🔔 موتور یادآوری مشترک (`Unified Reminder Engine`):** پشتیبانی یکپارچه از کارها، بدهی‌ها، عادت‌ها، اهداف و یادآور روزانه ثبت هزینه‌ها با قابلیت `Snooze` بدون تکرار، تغییر موعد، لغو خودکار پس از تکمیل/تسویه و پوشش حریم خصوصی (`hideSensitiveContent`).
            4. **📊 داشبورد هوشمند:** کارت «یادآوری‌های مهم و اقدام بعدی»، تفکیک صریح **«داده کافی نیست»** از مقدار `0`، برچسب **«(تخمینی)»** برای پیش‌بینی پایان ماه و شخصی‌سازی نمایش کارت‌ها.
            5. **🤖 دستیار هوشمند کنترل‌شده و گفتار آفلاین فارسی:** پرسش تکمیلی در ابهام (`AskClarification`)، تحلیل مبتنی بر داده واقعی و بازه زمانی، پیش‌نمایش و الزام تأیید عملیات حساس و پشتیبانی از تبدیل گفتار به متن فارسی آفلاین.
          files: |
            release-assets/Personal-Life-OS-v1.4.0-FinancePro-Debug.apk
            release-assets/Personal-Life-OS-v1.4.0-FinancePro-Release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

