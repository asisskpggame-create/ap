<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#101827"/><stop offset="100%" stop-color="#17263a"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#202f44"/><stop offset="100%" stop-color="#182538"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
<text x="1150" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f3f7ff" text-anchor="end">ارتباط بدهی و مسیر</text>
<text x="1150" y="112" font-family="Arial, sans-serif" font-size="19" fill="#aabbd1" text-anchor="end">یک بدهی اصلی، چند اقدام مرتبط، بدون ثبت دوباره</text>

<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="420" y="155" width="360" height="90" rx="18" fill="#193a45" stroke="#54c8a2" stroke-width="2"/>
  <text x="600" y="190" font-size="24" font-weight="700" fill="#f4fffc">رکورد اصلی بدهی</text>
  <text x="600" y="220" font-size="17" fill="#c0dedb">مبلغ کل • مانده • سررسید</text>
  <path d="M600 245 V285 M600 285 H290 V325 M600 285 H910 V325" fill="none" stroke="#8ba0b9" stroke-width="3"/>
  <rect x="70" y="325" width="440" height="120" rx="18" fill="#18334b" stroke="#65baf4" stroke-width="2"/>
  <text x="290" y="365" font-size="24" font-weight="700" fill="#f5fbff">برنامه مسیر</text>
  <text x="290" y="400" font-size="18" fill="#c8e0f3">کار مرتبط و یادآوری</text>
  <text x="290" y="425" font-size="16" fill="#90d3ff">فقط ارجاع به بدهی اصلی</text>
  <rect x="690" y="325" width="440" height="120" rx="18" fill="#2a2548" stroke="#a99aff" stroke-width="2"/>
  <text x="910" y="365" font-size="24" font-weight="700" fill="#fbf9ff">تراکنش پرداخت</text>
  <text x="910" y="400" font-size="18" fill="#d8d1f4">ثبت واقعی پرداخت فقط یک‌بار</text>
  <text x="910" y="425" font-size="16" fill="#b9adff">به‌روزرسانی مانده بدهی</text>
  <path d="M910 445 V485 H600 V515" fill="none" stroke="#8ba0b9" stroke-width="3"/>
  <rect x="300" y="515" width="600" height="90" rx="18" fill="#202f44" stroke="#8297b1"/>
  <text x="600" y="552" font-size="24" font-weight="700" fill="#f3f7ff">موتور یادآوری مشترک</text>
  <text x="600" y="581" font-size="17" fill="#aabbd1">تغییر موعد یا تسویه → به‌روزرسانی/لغو اعلان</text>
  <text x="600" y="655" font-size="17" fill="#aabbd1">قانون حیاتی: برنامه مسیر هرگز بدهی یا پرداخت تکراری ایجاد نکند.</text>
</g>
</svg>