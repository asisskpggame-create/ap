<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#101827"/><stop offset="100%" stop-color="#17263a"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#202f44"/><stop offset="100%" stop-color="#182538"/>
  </linearGradient>
</defs>
<rect width="100%" height="100%" rx="28" fill="url(#bg)"/>
<text x="1150" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#f3f7ff" text-anchor="end">ساختار چهار بخش اصلی</text>
<text x="1150" y="112" font-family="Arial, sans-serif" font-size="19" fill="#aabbd1" text-anchor="end">نمای مفهومی ناوبری پیشنهادی</text>

<g font-family="Arial, sans-serif" text-anchor="middle">
  <rect x="55" y="180" width="255" height="355" rx="24" fill="#193a45" stroke="#54c8a2" stroke-width="2"/>
  <circle cx="182" cy="245" r="38" fill="#285b5b"/><text x="182" y="258" font-size="36" fill="#b2ffe5">₿</text>
  <text x="182" y="320" font-size="29" font-weight="700" fill="#f4fffc">مالی</text>
  <text x="182" y="365" font-size="18" fill="#c0dedb">حساب‌ها و تراکنش‌ها</text><text x="182" y="396" font-size="18" fill="#c0dedb">بدهی و بودجه</text>
  <text x="182" y="449" font-size="16" fill="#87cbb8">منبع اصلی داده مالی</text>

  <rect x="345" y="180" width="255" height="355" rx="24" fill="#2a2548" stroke="#a99aff" stroke-width="2"/>
  <circle cx="472" cy="245" r="38" fill="#484071"/><text x="472" y="258" font-size="36" fill="#e1d9ff">◎</text>
  <text x="472" y="320" font-size="29" font-weight="700" fill="#fbf9ff">اهداف و مسیر</text>
  <text x="472" y="365" font-size="18" fill="#d8d1f4">اهداف و پروژه‌ها</text><text x="472" y="396" font-size="18" fill="#d8d1f4">کارها و عادت‌ها</text>
  <text x="472" y="449" font-size="16" fill="#b9adff">از هدف تا اقدام بعدی</text>

  <rect x="635" y="180" width="255" height="355" rx="24" fill="#19334b" stroke="#65baf4" stroke-width="2"/>
  <circle cx="762" cy="245" r="38" fill="#28517a"/><text x="762" y="258" font-size="36" fill="#c6eaff">▦</text>
  <text x="762" y="320" font-size="29" font-weight="700" fill="#f5fbff">داشبورد</text>
  <text x="762" y="365" font-size="18" fill="#c8e0f3">وضعیت امروز</text><text x="762" y="396" font-size="18" fill="#c8e0f3">اولویت‌ها و روندها</text>
  <text x="762" y="449" font-size="16" fill="#90d3ff">نمای خلاصه و قابل‌فهم</text>

  <rect x="925" y="180" width="220" height="355" rx="24" fill="#42243e" stroke="#ef9bd0" stroke-width="2"/>
  <circle cx="1035" cy="245" r="38" fill="#713d69"/><text x="1035" y="258" font-size="36" fill="#ffd3ec">✦</text>
  <text x="1035" y="320" font-size="29" font-weight="700" fill="#fff7fc">AI</text>
  <text x="1035" y="365" font-size="18" fill="#f2d4e8">فهم درخواست</text><text x="1035" y="396" font-size="18" fill="#f2d4e8">تحلیل و اقدام امن</text>
  <text x="1035" y="449" font-size="16" fill="#ffb6df">پیشنهاد پیش از اجرا</text>
  <path d="M310 355 H340 M600 355 H630 M890 355 H920" stroke="#71849c" stroke-width="3" stroke-linecap="round"/>
  <rect x="180" y="585" width="840" height="70" rx="18" fill="#172638" stroke="#536980"/>
  <text x="600" y="628" font-size="23" fill="#e8f0fb">یک منبع حقیقت برای داده‌ها؛ دسترسی‌های مرتبط از بخش‌های دیگر</text>
